<div class="gallery-container">
  <div class="header">
    <h1>Random Image Gallery</h1>
    <p>Explore a collection of random astronomical images from NASA's archive</p>
    <button mat-raised-button color="primary" (click)="loadRandomApods()" [disabled]="loading">
      <mat-icon>refresh</mat-icon>
      Load New Gallery
    </button>
  </div>

  <div *ngIf="loading && apods.length === 0" class="loading-container">
    <mat-spinner></mat-spinner>
    <p>Loading gallery...</p>
  </div>

  <div *ngIf="error" class="error-container">
    <mat-icon>error_outline</mat-icon>
    <p>{{ error }}</p>
    <button mat-raised-button color="primary" (click)="loadRandomApods()">
      <mat-icon>refresh</mat-icon>
      Try Again
    </button>
  </div>

  <div class="gallery-grid" *ngIf="apods.length > 0">
    <app-apod-card 
      *ngFor="let apod of apods" 
      [apod]="apod"
      [isFavorite]="isFavorite(apod.date)"
      (toggleFavorite)="toggleFavorite(apod, $event)">
    </app-apod-card>
</div>

  <div class="load-more" *ngIf="apods.length > 0">
    <button mat-raised-button color="accent" (click)="loadMore()" [disabled]="loading">
      <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
      <mat-icon *ngIf="!loading">add</mat-icon>
      {{ loading ? 'Loading...' : 'Load More' }}
    </button>
  </div>
</div>
