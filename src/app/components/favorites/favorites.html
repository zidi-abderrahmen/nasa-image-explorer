<div class="favorites-container">
  <div class="header">
    <div class="header-content">
      <div>
        <h1>
          <mat-icon>favorite</mat-icon>
          My Favorites
        </h1>
        <p>Your collection of favorite astronomical images</p>
      </div>
      <button 
        mat-raised-button 
        color="warn" 
        (click)="clearAllFavorites()"
        *ngIf="favorites.length > 0">
        <mat-icon>delete_sweep</mat-icon>
        Clear All
      </button>
    </div>
  </div>

  <div class="empty-state" *ngIf="favorites.length === 0">
    <mat-icon>favorite_border</mat-icon>
    <h2>No favorites yet</h2>
    <p>Start exploring and add your favorite astronomical images!</p>
    <div class="quick-links">
      <button mat-raised-button color="primary" routerLink="/">
        <mat-icon>home</mat-icon>
        Go to Home
      </button>
      <button mat-raised-button color="accent" routerLink="/gallery">
        <mat-icon>photo_library</mat-icon>
        Browse Gallery
      </button>
    </div>
  </div>

  <div class="favorites-grid" *ngIf="favorites.length > 0">
    <app-apod-card 
      *ngFor="let apod of favorites" 
      [apod]="apod"
      mode="favorite"
      [descriptionLength]="150"
      (remove)="removeFavorite(apod.date, $event)">
    </app-apod-card>
  </div>

  <div class="favorites-count" *ngIf="favorites.length > 0">
    <mat-chip-set>
      <mat-chip highlighted>
        <mat-icon>favorite</mat-icon>
        {{ favorites.length }} {{ favorites.length === 1 ? 'Favorite' : 'Favorites' }}
      </mat-chip>
    </mat-chip-set>
  </div>
</div>
