<div class="favorites-container">
  <!-- Header Section -->
  <div class="header">
    <div class="header-content">
      <div>
        <h1>
          <mat-icon>favorite</mat-icon>
          My Favorites
        </h1>
        <p class="subtitle">Your collection of favorite astronomical images</p>
      </div>
      <button 
        mat-raised-button 
        color="warn" 
        class="modern-button clear-all-btn"
        (click)="clearAllFavorites()"
        *ngIf="favorites.length > 0">
        <mat-icon>delete_sweep</mat-icon>
        Clear All
      </button>
    </div>
  </div>

  <!-- Empty State -->
  <div class="empty-state" *ngIf="favorites.length === 0">
    <div class="empty-icon-wrapper">
      <mat-icon>favorite_border</mat-icon>
    </div>
    <h2>No favorites yet</h2>
    <p>Start exploring and add your favorite astronomical images!</p>
    <div class="quick-links">
      <button mat-raised-button color="primary" class="modern-button" routerLink="/">
        <mat-icon>home</mat-icon>
        Go to Home
      </button>
      <button mat-raised-button color="accent" class="modern-button" routerLink="/gallery">
        <mat-icon>photo_library</mat-icon>
        Browse Gallery
      </button>
    </div>
  </div>

  <!-- Favorites Grid -->
  <div class="favorites-grid" *ngIf="favorites.length > 0">
    <app-apod-card 
      *ngFor="let apod of favorites" 
      [apod]="apod"
      mode="favorite"
      [descriptionLength]="150"
      (remove)="removeFavorite(apod.date, $event)">
    </app-apod-card>
  </div>

  <!-- Count Indicator -->
  <div class="favorites-count" *ngIf="favorites.length > 0">
    <mat-chip-set class="modern-chips">
      <mat-chip class="favorite-count-chip">
        <div class="chip-content">
          <mat-icon>favorite</mat-icon>
          <span>{{ favorites.length }} {{ favorites.length === 1 ? 'Favorite' : 'Favorites' }}</span>
        </div>
      </mat-chip>
    </mat-chip-set>
  </div>
</div>
