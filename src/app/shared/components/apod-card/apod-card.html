<mat-card class="apod-card modern-card" [routerLink]="['/detail', apod.date]">
  
  <!-- Image/Video Wrapper -->
  <div class="image-wrapper">
  <div class="shimmer" *ngIf="apod.media_type === 'image' && !isImageLoaded"></div>

  <img
    [src]="displayImageUrl" 
    [alt]="apod.title"
    (load)="onImageLoad($event)"
    [class.loaded]="isImageLoaded"
    mat-card-image>

  <!-- The Video Overlay -->
  <div *ngIf="apod.media_type === 'video' && apod.thumbnail_url" class="video-overlay">
    <mat-icon>play_circle_filled</mat-icon>
  </div>

    <!-- Favorite Toggle (Browse Mode) -->
    <button 
      *ngIf="mode === 'browse'"
      mat-icon-button 
      class="floating-btn favorite-btn" 
      (click)="onToggleFavorite($event)"
      [class.is-favorite]="isFavorite">
      <mat-icon>{{ isFavorite ? 'favorite' : 'favorite_border' }}</mat-icon>
    </button>

    <!-- Remove Toggle (Favorite Mode) -->
    <button 
      *ngIf="mode === 'favorite'"
      mat-icon-button 
      class="floating-btn remove-btn" 
      (click)="onRemove($event)"
      matTooltip="Remove from favorites">
      <mat-icon>close</mat-icon>
    </button>
    
    <!-- Favorite Badge Indicator -->
    <div *ngIf="mode === 'favorite'" class="favorite-badge">
      <mat-icon>favorite</mat-icon>
    </div>
  </div>

  <!-- Content Section -->
  <mat-card-content class="content-modern">
    <h3 class="card-title">{{ apod.title }}</h3>
    
    <mat-chip-set class="modern-chips">
      <mat-chip>
        <mat-icon *ngIf="mode === 'favorite'">calendar_today</mat-icon>
        {{ apod.date }}
      </mat-chip>
      <mat-chip *ngIf="apod.media_type === 'video'">
        <mat-icon>videocam</mat-icon>
        Video
      </mat-chip>
      <mat-chip *ngIf="apod.media_type === 'image'">
        <mat-icon>photo</mat-icon>
        Image
      </mat-chip>
      <mat-chip *ngIf="mode === 'favorite' && apod.copyright">
        <mat-icon>copyright</mat-icon>
        {{ apod.copyright }}
      </mat-chip>
    </mat-chip-set>
    
    <p class="description">
      {{ apod.explanation.length > descriptionLength 
          ? (apod.explanation.substring(0, descriptionLength) + '...') 
          : apod.explanation }}
    </p>
  </mat-card-content>
  
  <!-- Actions Section -->
  <mat-card-actions *ngIf="mode === 'favorite'" class="actions-modern">
    <button mat-button color="primary" class="modern-action-btn">
      <mat-icon>info</mat-icon>
      View Details
    </button>
    <button mat-button color="warn" class="modern-action-btn" (click)="onRemove($event)">
      <mat-icon>delete</mat-icon>
      Remove
    </button>
  </mat-card-actions>
</mat-card>
