<mat-card 
  class="apod-card skeleton-card" 
  role="status" 
  aria-label="Loading astronomy content" 
  aria-busy="true">

  <!-- Image Area -->
  <figure class="image-wrapper">
    <ngx-skeleton-loader 
      appearance="line" 
      animation="progress"
      class="skeleton-image">
    </ngx-skeleton-loader>
  </figure>

  <!-- Content Area -->
  <mat-card-content class="content-modern">
    <!-- Title -->
    <ngx-skeleton-loader 
      appearance="line" 
      animation="progress"
      class="skeleton-title">
    </ngx-skeleton-loader>

    <!-- Chips -->
    <ngx-skeleton-loader 
      appearance="line" 
      animation="progress"
      class="skeleton-chips">
    </ngx-skeleton-loader>

    <!-- Description Lines -->
    <ngx-skeleton-loader 
      appearance="line" 
      animation="progress"
      class="skeleton-text">
    </ngx-skeleton-loader>
    
    <ngx-skeleton-loader 
      appearance="line" 
      animation="progress"
      class="skeleton-text skeleton-text-short">
    </ngx-skeleton-loader>
  </mat-card-content>
</mat-card>
